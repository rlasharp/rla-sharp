name: NBA tracking (rebound chances, potential assists)
on:
  schedule:
    - cron: "41 10 * * *"    # ~5:41 AM ET, after NBA.com posts last night's tracking
    - cron: "41 16 * * *"    # ~11:41 AM ET backup
  push:
    paths: ["tools/fetch_track.py", ".github/workflows/track.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-odds
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/fetch_track.py
      - name: Commit if changed
        run: |
          git config user.name "rla-sharp-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/nba_track.json ] || exit 0
          git add data/nba_track.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "NBA tracking $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
