name: Live odds (PropLine)
on:
  schedule:
    - cron: "7,37 10-12 * * *"   # soccer mornings (European kickoffs from ~7 AM ET); soccer odds are throttled per match
    - cron: "7,37 13-23 * * *"   # every 30 min, ~8 AM–7 PM ET (UTC times; GitHub may run a few minutes late)
    - cron: "7,37 0-4 * * *"     # every 30 min, ~7 PM–midnight ET
  workflow_dispatch:
    inputs:
      force: { description: "refresh these now even if fresh (e.g. nhl, nfl, nhl,nfl)", default: "" }
permissions:
  contents: write
concurrency:
  group: live-odds
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet propline
      - name: Fetch props
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: python tools/fetch_odds.py
      - name: Commit if changed
        run: |
          git config user.name "rla-sharp-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live_odds.json data/close
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Live odds $(date -u +%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
