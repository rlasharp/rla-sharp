name: NBA closing spreads (ESPN)
on:
  schedule:
    - cron: "23 9 * * *"     # ~4:23 AM ET, after the night's games
  push:
    paths: ["tools/fetch_spreads.py", ".github/workflows/spreads.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: live-odds
  cancel-in-progress: false
jobs:
  spreads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python tools/fetch_spreads.py
      - name: Commit if changed
        run: |
          git config user.name "rla-sharp-odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba_spreads.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "NBA closing spreads $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
