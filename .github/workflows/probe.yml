name: Probe (one-off data checks, run by hand)
on:
  workflow_dispatch:
    inputs:
      script: { description: "tools/probe/<name>.py", default: "soccer_probe.py" }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet propline
      - env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python tools/probe/${{ github.event.inputs.script }}
