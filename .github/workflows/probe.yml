name: Probe ESPN feeds
on:
  push:
    paths: ["tools/auto/probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/auto/probe.py
      - run: |
          git config user.name "rla-sharp-bot"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -qm "probe ESPN feeds" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
