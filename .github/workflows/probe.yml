name: Source probe (one-off, delete after use)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet propline || true
      - run: python3 tools/probe.py
        env: { PROPLINE_API_KEY: "${{ secrets.PROPLINE_API_KEY }}" }
      - run: SP=icehockey_nhl python3 tools/probe.py 2>&1 | tail -40
        env: { PROPLINE_API_KEY: "${{ secrets.PROPLINE_API_KEY }}" }
