name: Auto refresh (NBA + NFL data, rebuild, check, publish)
run-name: "${{ github.event.inputs.reason && format('Quick update ({0}) - {1}', github.event.inputs.what, github.event.inputs.reason) || 'Auto refresh' }}"
on:
  schedule:
    - cron: "41 */2 * * *"        # every 2 hours, around the clock (off-peak minute; quick.yml adds game-night updates)
  workflow_dispatch:
    inputs:
      what: { description: "nba, nfl, nhl, soc or all", default: "all" }
      gate_state: { description: "(set by quick.yml) game-night state to save", default: "" }
      reason: { description: "(set by quick.yml) why this update was started", default: "" }
      nflv: { description: "1 = also refresh the weekly NFL play-by-play data now", default: "0" }
  push:
    paths: ["src/tools/auto_run.sh", "src/tools/auto_espn.py", "src/tools/check.js", ".github/workflows/auto.yml"]
permissions:
  contents: write
concurrency:
  group: live-odds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install headless browser for the site check
        run: |
          npm init -y >/dev/null && npm i --silent playwright@1
          # Ubuntu's package mirrors sometimes have a short DNS hiccup on GitHub's runners: retry a few times before giving up
          for i in 1 2 3 4; do npx playwright install --with-deps chromium >/dev/null 2>&1 && break; echo "browser install attempt $i failed — retrying"; sudo apt-get update -qq >/dev/null 2>&1 || true; sleep $((i*15)); done
          npx playwright install chromium >/dev/null
          echo "NODE_PATH=$PWD/node_modules" >> $GITHUB_ENV
      - name: Check the live public site (what visitors see)
        id: live
        continue-on-error: true
        run: |
          U="https://rlasharp.github.io/rla-sharp/"; L="$RUNNER_TEMP/live.html"; ISSUE=""
          CODE=$(curl -sS -L -A "Mozilla/5.0" -o "$L" -w '%{http_code}' --retry 3 --retry-delay 10 "$U?t=$(date +%s)" || echo 000)
          for F in nba_detail.js nhl_data.js lines_hist.js soccer_data.js soccer_players.js; do curl -sS -L -A "Mozilla/5.0" -o "$RUNNER_TEMP/$F" "${U}$F?t=$(date +%s)" || true; done
          SZ=$(stat -c %s "$L" 2>/dev/null || echo 0); RSZ=$(stat -c %s index.html)
          if [ "$CODE" != 200 ]; then ISSUE="site returned HTTP $CODE"
          elif [ "$SZ" -lt $((RSZ/2)) ]; then ISSUE="site page is too small ($SZ bytes vs $RSZ) — blank or broken"
          elif ! grep -q "1-800-GAMBLER" "$L"; then ISSUE="site page is missing the footer — wrong or broken page"
          elif ! node src/tools/check.js "$L" > "$RUNNER_TEMP/livecheck.txt" 2>&1; then ISSUE="live page fails the site check: $(head -c 400 "$RUNNER_TEMP/livecheck.txt" | tr '\n' ' ')"
          elif ! cmp -s "$L" index.html; then
            AGE=$(( $(date +%s) - $(git log -1 --format=%ct -- index.html) ))
            [ "$AGE" -gt 1800 ] && ISSUE="site is stale: GitHub Pages has not deployed the last update ($((AGE/60)) min old)"
          fi
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          [ -z "$ISSUE" ] && echo "Live site OK ($SZ bytes)" || { echo "LIVE SITE PROBLEM: $ISSUE"; exit 1; }
      - name: Refresh data, rebuild, check
        id: run
        env:
          FORCE_NFLV: ${{ github.event.inputs.nflv || '0' }}
        run: bash src/tools/auto_run.sh "${{ github.event.inputs.what || 'all' }}"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/rla/summary.txt" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - name: Commit if changed
        if: success()
        env:
          GATE_STATE: ${{ github.event.inputs.gate_state }}
        run: |
          git config user.name "rla-sharp-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$GATE_STATE" ]; then mkdir -p data; printf '%s\n' "$GATE_STATE" > data/quick.json; git add data/quick.json; fi
          git add -A index.html nhl_data.js nba_detail.js lines_hist.js 'soccer_*.js' version.json src data/soccer_box.json data/soccer_geo.json data/soccer_sched.json data/nfl_box.json data/nfl_geo.json data/nfl_refs.json data/soccer_mgr.json data/nhl_lines.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Auto refresh $(TZ=America/Toronto date '+%a %b %-d %-I:%M %p ET')"
          # pushed together with the health file in the next step: one push per update = one site deployment (two quick pushes made GitHub cancel the first deployment, which showed up as a failure)
      - name: Write health file
        if: always()
        run: |
          git config user.name "rla-sharp-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p data
          python3 - <<'PY'
          import json,os,datetime
          p="data/health.json"; h=json.load(open(p)) if os.path.exists(p) else {}
          h["auto"]={"at":datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),"ok":os.environ.get("RES")=="success",
                     "summary":open(os.path.join(os.environ["RUNNER_TEMP"],"rla","summary.txt")).read()[-1500:] if os.path.exists(os.path.join(os.environ["RUNNER_TEMP"],"rla","summary.txt")) else ""}
          iss=os.environ.get("LIVE_ISSUE",""); h["site"]={"at":h["auto"]["at"],"ok":os.environ.get("LIVE")=="success" and not iss,"issue":iss or ("" if os.environ.get("LIVE")=="success" else "live check did not run")}
          # NHL health: data generated, fresh, odds flowing, last-season backfill progress
          try:
              import re
              nd=open("src/nhl_data.js").read(); gen=re.search(r'const NHL_GEN="([^"]*)"',nd) or re.search(r'var NHL_GEN="([^"]*)"',nd)
              summ=h["auto"]["summary"]; lo=json.load(open("data/live_odds.json")).get("nhl") or {}
              pv=json.load(open("src/data/nhl_prev.json")) if os.path.exists("src/data/nhl_prev.json") else {}
              iss=[]
              if "NHL data FAILED" in summ: iss.append("NHL data step failed")
              if "NHL_TEAM" in nd and nd.count('"conf"')<32: iss.append("NHL standings incomplete")
              h["nhl"]={"at":h["auto"]["at"],"ok":not iss,"issue":"; ".join(iss),"gen":gen.group(1) if gen else "","odds_at":lo.get("at"),
                        "backfill":f"{sum(1 for v in (pv.get('games') or {}).values() if v)}/{len(pv.get('sched') or {})}"}
          except Exception as e:
              h["nhl"]={"at":h["auto"]["at"],"ok":False,"issue":f"health check error: {e}"}
          # rolling history for the weekly health report (tools/weekly_health.py): one short line per run, last ~40 days
          import re as _re
          summ=h["auto"].get("summary","")
          fails=[l.strip()[:160] for l in summ.splitlines() if _re.search(r"FAILED|kept old|skipped|error",l,_re.I)]
          h.setdefault("hist",[]).append({"at":h["auto"]["at"],"what":os.environ.get("WHAT") or "all","ok":h["auto"]["ok"],
              "site_ok":h["site"]["ok"],"site_issue":h["site"].get("issue","")[:160],"fails":fails[:12],
              "check_failed":"SITE CHECK FAILED" in summ,"published":"published (" in summ})
          h["hist"]=h["hist"][-600:]
          json.dump(h,open(p,"w"),indent=1)
          PY
          git add data/health.json; git commit -qm "health" || true
          [ -z "$(git log origin/main..HEAD --oneline 2>/dev/null)" ] && exit 0   # nothing to push
          for i in 1 2 3; do { git pull --rebase -X theirs -q origin main || { git rebase --abort; false; }; } && git push -q origin HEAD:main && exit 0; sleep 7; done   # -X theirs: on a clash in generated files keep this run's fresh copy
          echo "push failed 3 times"; exit 1
        env:
          RES: ${{ steps.run.outcome }}
          LIVE: ${{ steps.live.outcome }}
          LIVE_ISSUE: ${{ steps.live.outputs.issue }}
          WHAT: ${{ github.event.inputs.what || 'all' }}
