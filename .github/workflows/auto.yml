name: Auto refresh (NBA + NFL data, rebuild, check, publish)
on:
  schedule:
    - cron: "17 */2 * * *"        # every 2 hours, around the clock
  workflow_dispatch:
    inputs:
      what: { description: "nba, nfl or all", default: "all" }
  push:
    paths: ["src/tools/auto_run.sh", "src/tools/auto_espn.py", "src/tools/check.js", ".github/workflows/auto.yml"]
permissions:
  contents: write
concurrency:
  group: live-odds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install headless browser for the site check
        run: |
          npm init -y >/dev/null && npm i --silent playwright@1 && npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$PWD/node_modules" >> $GITHUB_ENV
      - name: Refresh data, rebuild, check
        id: run
        run: bash src/tools/auto_run.sh "${{ github.event.inputs.what || 'all' }}"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/rla/summary.txt" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
      - name: Commit if changed
        if: success()
        run: |
          git config user.name "rla-sharp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Auto refresh $(TZ=America/Toronto date '+%a %b %-d %-I:%M %p ET')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 7; done
          exit 1
      - name: Write health file
        if: always()
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json,os,datetime
          p="data/health.json"; h=json.load(open(p)) if os.path.exists(p) else {}
          h["auto"]={"at":datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),"ok":os.environ.get("RES")=="success",
                     "summary":open(os.path.join(os.environ["RUNNER_TEMP"],"rla","summary.txt")).read()[-1500:] if os.path.exists(os.path.join(os.environ["RUNNER_TEMP"],"rla","summary.txt")) else ""}
          json.dump(h,open(p,"w"),indent=1)
          PY
          git add data/health.json; git commit -qm "health" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 7; done
        env:
          RES: ${{ steps.run.outcome }}
